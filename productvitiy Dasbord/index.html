<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id ="main">

  <section class="allElement">
   <div class="todo elem" id="0">
    <img src="./to do list.jpg" alt="" >
     <h4>  TO DO list </h4> 
   </div>
    <div class="daily elem" id="1">
          <img src="./Daily plaaner.jpg" alt="" >
        <h4> Daily Planner</h4>Daily 
   </div>
    <div class="moti elem" id="2">
          <img src="./motivation2.avif" alt="" >
     <h4> Motivation </h4> 
   </div>
    <div class="pomo elem" id="3">
          <img src="./promodomo timer.jpg" alt="" >
      <h4> pomodoro Timer </h4>
   </div>
    <div class="goals elem" id="4">
          <img src="./daily goals.jpg" alt="" >
    <h4> Daily Goals </h4>
   </div>
   </section>
        
    <section class="fullElem  todo-list-fullpage" >
      <button class="back" id="0">Close</button>
      <h2>your Personalised Task List</h2>
       
      <div class="todo-container">
        <div class="addTask">
          <form>
            <input id="same" type="text" placeholder="Enter task">
            <textarea placeholder="Enter Details" id="" cols="30" rows="10"></textarea>
            <div class="mark-imp">
              <input type="checkbox" name="" id="check">
              <label for="check"> Mark as Important</label>
            </div>
            <button> Add Task</button>
          </form>
        </div>
        <div class="allTask">
          <div class="task">
            <h5> Ladte raho </h5>
            <button>Mark is Completed</button>
          </div>
        </div>
      </div>
    </section>
             
    <section class="fullElem  daily-planner-fullpage">
      <button class="back" id="1">Close</button>
      <h2> Daily planner </h2>
    </section> 
            
    <section class="fullElem  motivational-fullpage">
      <button class="back" id="2">Close</button>
      <h2> Motivation </h2>
    </section>
            
    <section class="fullElem  pomodoro-fullpage ">
      <button class="back" id="3">Close</button>
      <h2> Pomodoro Timer </h2>
    </section>
            
    <section class="fullElem  daily-goals-V">
      <button class="back" id="4">Close</button>
      <h2> Daily Gols </h2>
    </section>

    </div>
    <script src="script.js"></script>
</body>
</html>
