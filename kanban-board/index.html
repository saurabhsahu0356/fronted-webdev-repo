<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> KANBAN BOARD </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left"> KANBAN </div>
            <div class="right"><button> Add New Task </button></div>
        </nav>
        <section class="board">
                    <div class="task-column">
                        <div class="heading">
                            <div class="left"> TO Do </div>
                            <div class="right"> Count </div>
                        </div>
                <div draggable="true" class="task">
                <h5> TASK 1 </h5> 
                <p>Description for Task 1</p>
                <button> DELETE </button>
            </div>
                    </div>

                
        <div class="task-column hover-over">
                <div class="heading">
                <div class="left"> IN Progress </div>
                <div class="right"> Count </div>
            </div>
            </div>

            <div class="task-column">
                  <div class="heading">
                <div class="left"> Done </div>
                <div class="right"> Count </div>
            </div>
            </div>
        </section>
    </main>
</body>
</html>
